    <style>
        :root { --neon-yellow: #dfff00; --dark-bg: #0e1012; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--dark-bg); color: white; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { width: 90%; max-width: 400px; text-align: center; border: 2px solid var(--neon-yellow); padding: 30px; border-radius: 30px; background: #000; box-shadow: 0 0 25px rgba(223, 255, 0, 0.2); }
        .logo-img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid var(--neon-yellow); margin-bottom: 15px; box-shadow: 0 0 15px var(--neon-yellow); }
        h1 { font-size: 26px; margin: 10px 0; color: white; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #ccc; font-size: 14px; margin-bottom: 25px; line-height: 1.6; }
        .btn { background: var(--neon-yellow); color: black; text-decoration: none; padding: 18px; border-radius: 15px; display: block; font-weight: 900; font-size: 18px; cursor: pointer; border: none; width: 100%; transition: 0.3s; box-shadow: 0 5px 15px rgba(223, 255, 0, 0.4); animation: pulse 1.5s infinite; }
        
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--neon-yellow); border-radius: 50%; width: 50px; height: 50px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .loader-text { margin-top: 20px; font-size: 18px; color: var(--neon-yellow); font-weight: bold; letter-spacing: 1px; }
    </style>
</head>

    <div id="loader">

    <script>
