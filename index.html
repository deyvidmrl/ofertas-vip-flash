<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA FLASH OFERTAS - ACESSO</title>
    <!-- Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s){if(f.fb)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1736558787065660'); fbq('track', 'PageView');
    </script>
    
    <style>
        :root { --neon: #dfff00; --bg: #000000; --card: #111111; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: white; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        
        .container { width: 90%; max-width: 400px; padding: 30px 20px; border-radius: 24px; background: var(--card); border: 1px solid #222; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .logo { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--neon); margin-bottom: 20px; box-shadow: 0 0 20px rgba(223, 255, 0, 0.3); }
        
        h1 { font-size: 22px; margin-bottom: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        p { color: #888; font-size: 14px; margin-bottom: 30px; }
        
        .btn { background: var(--neon); color: black; text-decoration: none; padding: 18px; border-radius: 14px; display: block; font-weight: 900; font-size: 16px; border: none; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); background: #f0ff42; }

        /* Estilo da Verificação (O que você gostou) */
        #verify-screen { display: none; text-align: left; }
        .step { display: flex; align-items: center; margin-bottom: 15px; font-size: 14px; color: #555; }
        .step.active { color: white; }
        .step.done { color: var(--neon); }
        .icon { margin-right: 15px; width: 20px; text-align: center; }
        
        .progress-bar { width: 100%; height: 6px; background: #222; border-radius: 10px; margin-top: 25px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--neon); transition: width 0.5s; }
    </style>
</head>
<body>

    <!-- TELA INICIAL -->
    <div class="container" id="main-card">
        <img src="logo.png" alt="Flash Ofertas" class="logo">
        <h1>Acesso ao Grupo VIP</h1>
        <p>Clique no botão abaixo para verificar a disponibilidade de vagas e entrar no grupo.</p>
        <button class="btn" onclick="startVerification()">QUERO ACESSAR O GRUPO</button>
    </div>

    <!-- TELA DE VERIFICAÇÃO -->
    <div class="container" id="verify-screen">
        <h2 style="font-size: 18px; margin-bottom: 25px; text-align: center;">VERIFICANDO ACESSO...</h2>
        
        <div class="step" id="step1"><div class="icon" id="icon1">○</div> Verificando integridade do link...</div>
        <div class="step" id="step2"><div class="icon" id="icon2">○</div> Analisando vagas disponíveis...</div>
        <div class="step" id="step3"><div class="icon" id="icon3">○</div> Criptografando conexão segura...</div>
        <div class="step" id="step4"><div class="icon" id="icon4">○</div> Redirecionando para o WhatsApp...</div>

        <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    </div>

    <script>
    function startVerification() {
        fbq('track', 'Lead'); // Rastreia o Lead no momento do clique
        
        document.getElementById('main-card').style.display = 'none';
        document.getElementById('verify-screen').style.display = 'block';

        const steps = [
            { id: 1, time: 800, progress: 25 },
            { id: 2, time: 1800, progress: 50 },
            { id: 3, time: 2800, progress: 80 },
            { id: 4, time: 3800, progress: 100 }
        ];

        steps.forEach(step => {
            setTimeout(() => {
                document.getElementById('step' + step.id).classList.add('done');
                document.getElementById('icon' + step.id).innerText = '✓';
                document.getElementById('fill').style.width = step.progress + '%';
                
                if(step.id === 4) {
                    setTimeout(() => {
                        window.location.href = "https://chat.whatsapp.com/CWK1ZpdKCzJ7pTNY7QLnvz";
                    }, 1000);
                }
            }, step.time);
        });
    }
    </script>
</body>
</html>
